
name: SIBILLA Multimodel Acquisition

on:
  workflow_dispatch:

  schedule:
    - cron: "11,41 * * * *"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/sibilla.yml"

permissions:
  contents: write

concurrency:
  group: sibilla-multimodel
  cancel-in-progress: false

jobs:
  acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/sibilla.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "eccodes>=2.38,<3" \
            "shapely>=2,<3" \
            "pyshp>=2.3,<3" \
            "ecmwf-opendata" \
            "dwdopen"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            backend/sibilla.py \
            backend/gfs_engine.py \
            backend/ecmwf_engine.py \
            backend/icon_engine.py \
            backend/model_selector.py \
            backend/sinottica_intake.py \
            backend/source_alignment.py \
            backend/fusion_context.py \
            backend/verification.py

      - name: Acquire IRIDE observations
        id: iride
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python backend/sibilla.py

      - name: Acquire SINOTTICA diagnostic feed
        id: sinottica
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python backend/sinottica_intake.py

      - name: Acquire NOAA GFS
        id: gfs
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python backend/gfs_engine.py

      - name: Acquire ECMWF IFS
        id: ecmwf
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python backend/ecmwf_engine.py

      # ICON-2I: quattro tentativi giornalieri.
      # Non modifica gli orizzonti previsionali.
      # Gli avvii manuali e push eseguono ICON.
      - name: Decide ICON-2I acquisition
        id: icon_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run_icon=true" >> "$GITHUB_OUTPUT"
            echo "ICON-2I: manual or push run"
            exit 0
          fi

          # Use the last published attempt, not exact runner start minutes.
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          slot = now.replace(hour=((now.hour-2)%24)//6*6+2, minute=0, second=0, microsecond=0)
          if slot > now:
              from datetime import timedelta
              slot -= timedelta(days=1)
          p = Path("data/icon_attempt.json")
          try:
              last = datetime.fromisoformat(json.loads(p.read_text())["attempted_at"])
          except (OSError, ValueError, KeyError, TypeError):
              last = datetime.min.replace(tzinfo=timezone.utc)
          run = last < slot
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("run_icon=" + str(run).lower() + "\n")
          PY

      - name: Acquire ItaliaMeteo ICON-2I
        id: icon
        if: steps.icon_gate.outputs.run_icon == 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python -c 'import json; from datetime import datetime, timezone; from pathlib import Path; Path("data/icon_attempt.json").write_text(json.dumps({"attempted_at": datetime.now(timezone.utc).isoformat()}))'
          python backend/icon_engine.py

      - name: Align ARGO observations with IRIDE and SINOTTICA
        id: argo
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python backend/source_alignment.py

      - name: Select available model products
        id: selector
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python backend/model_selector.py

      - name: Correlate ARGO IRIDE and SINOTTICA with forecast footprints
        id: fusion
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python backend/fusion_context.py

      - name: Validate published forecasts
        id: validation
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("data/forecast")
          horizons = (4, 8, 16, 24, 36)
          available = 0

          for h in horizons:
              path = root / f"{h}h.geojson"

              if not path.exists():
                  print(f"+{h}h: unavailable")
                  continue

              try:
                  with path.open(encoding="utf-8") as f:
                      product = json.load(f)

                  metadata = product["metadata"]

                  assert product["type"] == "FeatureCollection"
                  assert isinstance(product["features"], list)
                  assert metadata["status"] == "ready"
                  assert metadata["horizon_hours"] == h
                  assert metadata["land_mask"] is True
                  assert metadata["probability_calibrated"] is False
                  assert metadata["geometry_type"] == \
                      "merged_land_clipped_polygons"

                  valid = datetime.fromisoformat(
                      metadata["forecast_valid_at"].replace(
                          "Z", "+00:00"
                      )
                  )

                  assert valid > datetime.now(timezone.utc)

                  for feature in product["features"]:
                      assert feature["type"] == "Feature"
                      assert feature["properties"]["class"] in (
                          "A", "B", "C"
                      )
                      assert feature["geometry"]["type"] in (
                          "Polygon", "MultiPolygon"
                      )

                  available += 1
                  print(f"+{h}h: valid")

              except Exception as exc:
                  print(f"+{h}h: rejected: {exc}")
                  path.unlink(missing_ok=True)

          print(f"Validated horizons: {available}/5")
          assert available > 0, "No valid forecast horizons"
          PY

      - name: Archive and verify forecasts
        id: verification
        continue-on-error: true
        run: python backend/verification.py

      - name: Save acquisition report
        if: always()
        env:
          SINOTTICA_RESULT: ${{ steps.sinottica.outcome }}
          GFS_RESULT: ${{ steps.gfs.outcome }}
          ECMWF_RESULT: ${{ steps.ecmwf.outcome }}
          ICON_RESULT: ${{ steps.icon.outcome }}
          ICON_GATE: ${{ steps.icon_gate.outputs.run_icon }}
          IRIDE_RESULT: ${{ steps.iride.outcome }}
          ARGO_RESULT: ${{ steps.argo.outcome }}
          FUSION_RESULT: ${{ steps.fusion.outcome }}
          SELECTOR_RESULT: ${{ steps.selector.outcome }}
          VERIFICATION_RESULT: ${{ steps.verification.outcome }}
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          report = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "sinottica": os.environ.get("SINOTTICA_RESULT"),
              "gfs": os.environ.get("GFS_RESULT"),
              "ecmwf": os.environ.get("ECMWF_RESULT"),
              "icon": os.environ.get("ICON_RESULT"),
              "icon_scheduled": (
                  os.environ.get("ICON_GATE") == "true"
              ),
              "iride": os.environ.get("IRIDE_RESULT"),
              "argo": os.environ.get("ARGO_RESULT"),
              "fusion": os.environ.get("FUSION_RESULT"),
              "selector": os.environ.get("SELECTOR_RESULT"),
              "validation": os.environ.get("VALIDATION_RESULT"),
              "verification": os.environ.get("VERIFICATION_RESULT"),
              "note": (
                  "Workflow outcomes only. "
                  "Success does not establish "
                  "forecast accuracy."
              )
          }

          target = Path("data/acquisition_report.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Publish data
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          SNAPSHOT="$(mktemp -d)"
          trap 'rm -rf "$SNAPSHOT"' EXIT

          mkdir -p "$SNAPSHOT/data"
          cp -a data/. "$SNAPSHOT/data/"

          for h in 4 8 16 24 36; do
            if [ ! -f "data/forecast/${h}h.geojson" ]; then
              touch "$SNAPSHOT/missing_${h}"
            fi
          done

          for attempt in 1 2 3 4 5; do
            echo "Publication attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp -a "$SNAPSHOT/data/." data/

            for h in 4 8 16 24 36; do
              if [ -f "$SNAPSHOT/missing_${h}" ]; then
                rm -f "data/forecast/${h}h.geojson"
              fi
            done

              git add -A data/

            if git diff --cached --quiet; then
              echo "No data changes"
              exit 0
            fi

            git commit -m \
              "SIBILLA multimodel data update"

            if git push origin HEAD:main; then
              echo "Data published successfully"
              exit 0
            fi

            echo "Remote changed, retrying..."
            sleep 5
          done

          echo "Publication failed after 5 attempts"
          exit 1
          
