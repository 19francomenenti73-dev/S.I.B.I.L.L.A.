
name: SIBILLA Scientific Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
  push:
    branches: [main]
    paths:
      - "backend/sibilla.py"
      - "backend/gfs_engine.py"
      - ".github/workflows/sibilla.yml"

permissions:
  contents: write

concurrency:
  group: sibilla-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GFS decoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install "eccodes>=2.38,<3"

      - name: Compile scientific backends
        run: |
          python -m py_compile backend/sibilla.py backend/gfs_engine.py

      - name: Acquire IRIDE radar observations
        id: radar
        run: python backend/sibilla.py

      - name: Generate experimental GFS outlooks
        id: gfs
        continue-on-error: true
        timeout-minutes: 12
        run: python backend/gfs_engine.py

      - name: Publish scientific products
        if: always() && steps.radar.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No new products."
            exit 0
          fi
          git commit -m "Update SIBILLA scientific products"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent update conflict"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Products published"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish after 3 attempts"
          exit 1
          
